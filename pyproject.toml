[project]
name = "oc-p12"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "faostat>=2.0.1",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.15",
    "numpy>=2.5.1",
    "pandas>=2.3,<3",
    # Le front interroge l'API avec requests. Présent en transitif via mlflow, mais une
    # dépendance transitive peut disparaître à la prochaine résolution : on la déclare.
    "requests>=2.32",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    # httpx est le client de fastapi.testclient. Il est déjà présent en transitif, mais
    # une dépendance transitive peut disparaître à la prochaine résolution : déclarée ici,
    # la CI ne peut pas casser sur une mise à jour sans rapport.
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bruit de NumPy 2.5 remonté par joblib au chargement d'un modèle, pas par notre code.
# Filtré et non supprimé : à retirer quand scikit-learn aura suivi, pour le revoir.
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning"]
